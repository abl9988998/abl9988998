<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b17"/>
      <stop offset="55%" stop-color="#131f3b"/>
      <stop offset="100%" stop-color="#1e2e56"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#62d6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#62d6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .zh{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#edf4ff}
      .en{font-family:"Inter","Segoe UI",Arial,sans-serif;fill:#f7fbff}
      .muted{fill:#b7c8ea}
      .chip{fill:#0f1830;stroke:#3f5f9f;stroke-width:2}
    </style>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>

  <!-- Header -->
  <g transform="translate(90,70)">
    <rect x="0" y="0" width="3660" height="250" rx="34" fill="#0e1730" stroke="#3c5fa6" stroke-width="4"/>
    <text x="48" y="92" class="zh" font-size="86" font-weight="800">英语 be 状态思维 V2 海报</text>
    <text x="48" y="162" class="en" font-size="54" font-weight="700" fill="#66ddff">be = place the subject in STATE / SPACE / RELATION / CHANGE</text>
    <text x="48" y="218" class="zh muted" font-size="40">先看“处于什么状态”，再看“做了什么动作”。</text>
  </g>

  <!-- Core map -->
  <g transform="translate(90,350)">
    <rect x="0" y="0" width="3660" height="250" rx="28" fill="#0d152b" stroke="#355797" stroke-width="3"/>
    <text x="40" y="72" class="zh" font-size="50" font-weight="700">① 万能公式：主语 + be + 状态/位置/关系（非动作优先）</text>
    <text x="40" y="145" class="zh muted" font-size="38">② 识别路径：谁（主语）→ 在什么状态（补语）→ 何时（时态）→ 字面空间 or 抽象空间（in / under / on）</text>
    <text x="40" y="212" class="zh muted" font-size="38">③ 输出策略：先说状态，再补动作与原因。</text>
  </g>

  <!-- Four cards -->
  <g transform="translate(90,640)">
    <!-- A -->
    <g transform="translate(0,0)">
      <rect width="870" height="1250" rx="26" fill="#111b31" stroke="#2f7cff" stroke-width="4"/>
      <rect x="20" y="20" width="830" height="92" rx="16" fill="#2f7cff"/>
      <text x="44" y="82" class="zh" font-size="48" font-weight="800">A 工作 Work</text>
      <text x="40" y="170" class="en" font-size="34">1) I am available after 3 PM.</text><text x="62" y="208" class="zh muted" font-size="28">我3点后有空（可用状态）</text>
      <text x="40" y="268" class="en" font-size="34">2) The report is ready.</text><text x="62" y="306" class="zh muted" font-size="28">报告准备好了（完成状态）</text>
      <text x="40" y="366" class="en" font-size="34">3) We are behind schedule.</text><text x="62" y="404" class="zh muted" font-size="28">我们进度落后（位置隐喻）</text>
      <text x="40" y="464" class="en" font-size="34">4) The server is down.</text><text x="62" y="502" class="zh muted" font-size="28">服务器不可用（系统状态）</text>
      <text x="40" y="562" class="en" font-size="34">5) I am under pressure.</text><text x="62" y="600" class="zh muted" font-size="28">我压力很大（受压状态）</text>
      <rect x="28" y="1110" width="814" height="110" rx="14" class="chip"/>
      <text x="48" y="1176" class="zh" font-size="32">关键词：ready / available / behind / down / under</text>
    </g>

    <!-- B -->
    <g transform="translate(930,0)">
      <rect width="870" height="1250" rx="26" fill="#111b31" stroke="#2eb67d" stroke-width="4"/>
      <rect x="20" y="20" width="830" height="92" rx="16" fill="#2eb67d"/>
      <text x="44" y="82" class="zh" font-size="48" font-weight="800">B 社交 Social</text>
      <text x="40" y="170" class="en" font-size="34">1) She is in a good mood.</text><text x="62" y="208" class="zh muted" font-size="28">她心情好（情绪容器）</text>
      <text x="40" y="268" class="en" font-size="34">2) I am late.</text><text x="62" y="306" class="zh muted" font-size="28">我迟到了（时间状态）</text>
      <text x="40" y="366" class="en" font-size="34">3) We are on the same page.</text><text x="62" y="404" class="zh muted" font-size="28">我们想法一致（同页隐喻）</text>
      <text x="40" y="464" class="en" font-size="34">4) He is into jazz.</text><text x="62" y="502" class="zh muted" font-size="28">他迷爵士（兴趣关系）</text>
      <text x="40" y="562" class="en" font-size="34">5) They are in a relationship.</text><text x="62" y="600" class="zh muted" font-size="28">他们在交往（关系容器）</text>
      <rect x="28" y="1110" width="814" height="110" rx="14" class="chip"/>
      <text x="48" y="1176" class="zh" font-size="32">关键词：in / on / into / relationship</text>
    </g>

    <!-- C -->
    <g transform="translate(1860,0)">
      <rect width="870" height="1250" rx="26" fill="#111b31" stroke="#f5b942" stroke-width="4"/>
      <rect x="20" y="20" width="830" height="92" rx="16" fill="#f5b942"/>
      <text x="44" y="82" class="zh" font-size="48" font-weight="800">C 学习 Study</text>
      <text x="40" y="170" class="en" font-size="34">1) I am stuck on question 5.</text><text x="62" y="208" class="zh muted" font-size="28">我卡在第5题（卡住状态）</text>
      <text x="40" y="268" class="en" font-size="34">2) My answer is wrong.</text><text x="62" y="306" class="zh muted" font-size="28">我的答案错了（判定状态）</text>
      <text x="40" y="366" class="en" font-size="34">3) The question is tricky.</text><text x="62" y="404" class="zh muted" font-size="28">这题刁钻（属性状态）</text>
      <text x="40" y="464" class="en" font-size="34">4) I am confident.</text><text x="62" y="502" class="zh muted" font-size="28">我有信心（心理状态）</text>
      <text x="40" y="562" class="en" font-size="34">5) I am not familiar with this topic.</text><text x="62" y="600" class="zh muted" font-size="28">我对这个主题不熟（关系状态）</text>
      <rect x="28" y="1110" width="814" height="110" rx="14" class="chip"/>
      <text x="48" y="1176" class="zh" font-size="32">关键词：stuck / wrong / tricky / confident</text>
    </g>

    <!-- D -->
    <g transform="translate(2790,0)">
      <rect width="870" height="1250" rx="26" fill="#111b31" stroke="#c24ddb" stroke-width="4"/>
      <rect x="20" y="20" width="830" height="92" rx="16" fill="#c24ddb"/>
      <text x="44" y="82" class="zh" font-size="48" font-weight="800">D 自我 Self</text>
      <text x="40" y="170" class="en" font-size="34">1) I am exhausted.</text><text x="62" y="208" class="zh muted" font-size="28">我累坏了（生理状态）</text>
      <text x="40" y="268" class="en" font-size="34">2) I am in trouble.</text><text x="62" y="306" class="zh muted" font-size="28">我有麻烦了（处境容器）</text>
      <text x="40" y="366" class="en" font-size="34">3) I am lost.</text><text x="62" y="404" class="zh muted" font-size="28">我迷路/迷茫（定位状态）</text>
      <text x="40" y="464" class="en" font-size="34">4) I am getting better.</text><text x="62" y="502" class="zh muted" font-size="28">我正在变好（变化过程）</text>
      <text x="40" y="562" class="en" font-size="34">5) I am proud of myself.</text><text x="62" y="600" class="zh muted" font-size="28">我为自己骄傲（情绪关系）</text>
      <rect x="28" y="1110" width="814" height="110" rx="14" class="chip"/>
      <text x="48" y="1176" class="zh" font-size="32">关键词：in trouble / lost / getting better</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(90,1930)">
    <rect x="0" y="0" width="3660" height="170" rx="22" fill="#0b1225" stroke="#4266af" stroke-width="3"/>
    <text x="36" y="68" class="zh" font-size="42" fill="#9edbff">三步内化法：① 每天写5句 be 日记 ② 动作句→状态句改写 ③ 同义状态句三连练习</text>
    <text x="36" y="132" class="zh" font-size="40">口语发射模板：I am in… / I am under… / I am becoming… / We are on…</text>
  </g>
</svg>
